name: Beta feedback
description: A note from inside the game (F, or Send feedback in the pause menu)
title: "Feedback: "
labels: [feedback, beta]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: In your own words. One thing per note is easiest to act on.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Game details
      description: Filled in by the game when you sent this, so we can find the moment. You can leave it as it is.
      render: text
