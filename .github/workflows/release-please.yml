name: Release Please

# every push to main updates one open release PR (changelog + version bump);
# merging that PR tags a beta pre-release on GitHub. the merge is a push to main, so Pages deploys it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
