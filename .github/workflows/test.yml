name: Test

# lint, unit tests, and the game played by a script in headless Chrome. runs on every pull request (release-please's
# included) and before every deploy, which calls it.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every script must parse
        run: for f in src/*.js src/lib/*.js sw.js; do node --check "$f"; done
      - run: npm run lint
      - run: npm run test:unit
      - name: Play the game
        run: npm run test:game
        env:
          CHROME: /usr/bin/google-chrome
