name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Every script must parse, or nothing ships
        run: for f in src/*.js; do node --check "$f"; done
      - uses: actions/configure-pages@v5
      - name: Stamp script URLs with this commit, so a visitor never gets a mix of old and new files
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
