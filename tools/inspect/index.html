<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brackish model inspector</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1016; color: #dde6ee; font: 13px/1.5 system-ui, sans-serif; overflow: hidden; }
  #panel { position: fixed; top: 12px; left: 12px; background: #0b1016e6; border: 1px solid #2a3642; border-radius: 6px; padding: 10px 12px; max-width: 280px; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; } #panel label { display: block; cursor: pointer; } #panel small { opacity: .7; }
  #readout { position: fixed; bottom: 12px; left: 12px; background: #0b1016e6; border: 1px solid #2a3642; border-radius: 6px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
</style>

<div id="panel"><h1>Model inspector</h1><div id="info"><small>loading…</small></div><div id="parts"></div>
  <small>drag to orbit · right-drag to pan · scroll to zoom · the blue plane is sea level</small></div>
<div id="readout">point at something to read its height</div>
